<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:20px;background:var(--surface);}
  .row{display:flex;gap:10px;align-items:flex-end}
  .swatch{width:120px;height:80px;border-radius:6px;border:1px solid var(--border-soft);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:6px;box-shadow:var(--shadow-card)}
  .swatch span{font-size:10px;font-weight:700;font-family:monospace;background:rgba(255,255,255,.92);padding:2px 5px;border-radius:3px;color:#222}
  .swatch.dark span{color:#222}
</style></head><body>
<div class="row">
  <div class="swatch" style="background:#1abadf"><span>brand-cyan #1abadf</span></div>
  <div class="swatch" style="background:#009ee2"><span>cyan-dark #009ee2</span></div>
  <div class="swatch" style="background:#2ccdde"><span>cyan-light #2ccdde</span></div>
  <div class="swatch" style="background:linear-gradient(to right,#009ee2,#1abadf,#2ccdde)"><span>sidebar gradient</span></div>
  <div class="swatch" style="background:#d4ebf4"><span>cyan-soft #d4ebf4</span></div>
</div>
</body></html>
