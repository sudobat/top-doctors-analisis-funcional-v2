<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:20px;background:var(--page-bg);}
.btn{display:inline-flex;align-items:center;justify-content:center;font:700 14px var(--font-sans);padding:10px 22px;border-radius:4px;border:0;cursor:pointer;color:#fff;background:var(--grad-cta);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn.ghost{background:transparent;color:var(--brand-cyan-dark);border:1px solid var(--brand-cyan-dark);box-shadow:none}
.btn.danger{background:var(--danger)}
.btn.disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
</style></head><body>
<div class="row">
  <button class="btn">Editar</button>
  <button class="btn">Guardar</button>
  <button class="btn ghost">Cancelar</button>
  <button class="btn danger">Eliminar</button>
  <button class="btn disabled">Disabled</button>
</div>
</body></html>
