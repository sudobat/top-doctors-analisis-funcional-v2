<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:20px;background:var(--page-bg);}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font:700 12px var(--font-sans);color:var(--text-primary)}
.field input{font:400 14px var(--font-sans);padding:9px 12px;border:1px solid var(--border-input);border-radius:4px;background:#fff;outline:none;color:var(--text-primary)}
.field input:focus{border-color:var(--brand-cyan-dark);box-shadow:0 0 0 2px rgba(0,158,226,.2)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
</style></head><body>
<div class="row">
  <div class="field"><label>Nombre</label><input value=""></div>
  <div class="field"><label>Ciudad</label><input placeholder="" value="Madrid"></div>
  <div class="field"><label>Correo electrónico</label><input value="" placeholder="doctor@clinica.es"></div>
</div>
</body></html>
