<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:0;background:var(--page-bg);font-family:var(--font-sans);}
.sb{width:60px;height:140px;background:var(--grad-sidebar);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:18px}
.ic{width:30px;height:30px;color:#fff;display:flex;align-items:center;justify-content:center}
.ic.active{background:#fff;border-radius:6px;color:var(--brand-cyan-dark)}
.ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.wrap{display:flex;align-items:center;gap:12px;padding:8px}
.note{font-size:11px;color:var(--text-secondary)}
</style></head><body>
<div class="wrap">
<div class="sb">
  <div class="ic active"><svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg></div>
  <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg></div>
</div>
<div class="note">Sidebar gradient<br>#009ee2 → #2ccdde<br>White icons, 1.6px stroke<br>Active item: white pill</div>
</div>
</body></html>
