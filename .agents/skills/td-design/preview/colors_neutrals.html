<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:20px;background:var(--surface);}
  .row{display:flex;gap:10px;align-items:flex-end}
  .swatch{width:120px;height:80px;border-radius:6px;border:1px solid var(--border-soft);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:6px;box-shadow:var(--shadow-card)}
  .swatch span{font-size:10px;font-weight:700;font-family:monospace;background:rgba(255,255,255,.92);padding:2px 5px;border-radius:3px;color:#222}
</style></head><body>
<div class="row">
  <div class="swatch" style="background:#112233;color:white"><span>header-navy #112233</span></div>
  <div class="swatch" style="background:#272727;color:white"><span>text-primary #272727</span></div>
  <div class="swatch" style="background:#5b7a81;color:white"><span>text-secondary #5b7a81</span></div>
  <div class="swatch" style="background:#f2f6f8"><span>page-bg #f2f6f8</span></div>
  <div class="swatch" style="background:#ffffff"><span>surface #ffffff</span></div>
  <div class="swatch" style="background:#e6e6e6"><span>border-soft #e6e6e6</span></div>
</div>
</body></html>
