<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{padding:20px;background:var(--surface);}
  .row{display:flex;gap:10px;align-items:flex-end}
  .swatch{width:120px;height:80px;border-radius:6px;border:1px solid var(--border-soft);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:6px;box-shadow:var(--shadow-card)}
  .swatch span{font-size:10px;font-weight:700;font-family:monospace;background:rgba(255,255,255,.92);padding:2px 5px;border-radius:3px;color:#222}
</style></head><body>
<div class="row">
  <div class="swatch" style="background:#34b154"><span>success #34b154</span></div>
  <div class="swatch" style="background:#a1d100"><span>success-light #a1d100</span></div>
  <div class="swatch" style="background:#ff3c52"><span>danger #ff3c52</span></div>
  <div class="swatch" style="background:#fdc007"><span>warn-accent #fdc007</span></div>
  <div class="swatch" style="background:#f3efda"><span>warn-bg #f3efda</span></div>
</div>
</body></html>
