<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:20px;background:var(--page-bg);}
.banner{display:flex;gap:14px;padding:14px 18px;border-radius:6px;align-items:flex-start;font:700 13px/1.45 var(--font-sans)}
.info{background:var(--brand-cyan-soft);color:var(--brand-cyan-dark)}
.info .ico{width:24px;height:24px;border-radius:50%;background:var(--brand-cyan-dark);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-style:italic;font-family:Georgia,serif;font-weight:700}
.warn{background:var(--warn-bg);color:var(--warn-text);font-weight:600;font-size:13px}
.warn .ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--warn-accent);font-weight:900;font-size:18px;flex-shrink:0}
.warn b{color:var(--text-primary)}
</style></head><body>
<div class="banner info">
  <div class="ico">i</div>
  <div>Estimado doctor, en base a sus especialidades Top Doctors le asigna por defecto una serie de servicios estándar.</div>
</div>
<div style="height:10px"></div>
<div class="banner warn">
  <div class="ico">!</div>
  <div>Este servicio está desactivado. <b>Actívelo y configúrelo</b>.</div>
</div>
</body></html>
