<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:0;background:var(--page-bg);font-family:var(--font-sans);}
.bar{height:60px;background:#fff;display:flex;align-items:center;padding:0 24px;gap:20px;border-bottom:1px solid var(--border-soft)}
.burger{width:36px;height:36px;border-radius:6px;background:#fff;border:1px solid var(--border-soft);display:flex;align-items:center;justify-content:center;color:var(--brand-cyan-dark);font-size:18px}
.title{font:700 22px var(--font-sans);flex:1;text-align:center;color:var(--text-primary)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--border-input);border-radius:4px;padding:6px 10px;background:#fff;width:220px;font-size:13px;color:var(--text-secondary)}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border-soft);border-radius:999px;padding:4px 10px;font-weight:700;font-size:13px;color:var(--text-primary)}
.ctx{font-size:11px;color:var(--text-secondary);margin-bottom:2px}
.ctxwrap{display:flex;flex-direction:column}
</style></head><body>
<div class="bar">
  <div class="burger">≡</div>
  <div class="title">Servicios</div>
  <div class="search">Buscar servicios <span style="margin-left:auto">⌕</span></div>
  <div class="ctxwrap"><div class="ctx">Seleccionar consulta</div><span class="pill">Con agenda <span style="color:var(--text-secondary);font-weight:400">(+2 consultas)</span> ▾</span></div>
</div>
</body></html>
