<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>body{padding:20px;background:var(--page-bg);font-family:var(--font-sans);}
.dd{width:280px;background:#fff;border-radius:8px;box-shadow:var(--shadow-pop);padding:6px;font-size:13px}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px}
.it:hover{background:var(--surface-hover)}
.cb{width:18px;height:18px;border-radius:3px;background:var(--success);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:900}
.t{flex:1;font-weight:700;color:var(--text-primary)}
.dot{width:11px;height:11px;border-radius:50%}
.pill{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border-soft);border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
</style></head><body>
<div style="margin-bottom:14px"><span class="pill">Con agenda <span style="color:var(--text-secondary);font-weight:400">(+2 consultas)</span> ▾</span></div>
<div class="dd">
  <div class="it"><span class="cb">✓</span><span class="t">Con agenda</span><span class="dot" style="background:#009ee2"></span></div>
  <div class="it"><span class="cb">✓</span><span class="t">Consulta Antonio Wallet</span><span class="dot" style="background:#a1d100"></span></div>
  <div class="it"><span class="cb">✓</span><span class="t">Ofimedic</span><span class="dot" style="background:#ff3c52"></span></div>
</div>
</body></html>
